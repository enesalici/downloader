services:
  app:
    build: .
    container_name: video-indir
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/data

  # Alan adınız varsa HTTPS için:  docker compose --profile https up -d
  # (.env içinde DOMAIN=... ve TRUST_PROXY=1, COOKIE_SECURE=1 ayarlayın)
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
